name: Feature request
description: Suggest an enhancement or new capability for Custom Agent AGY
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Tell us how we can improve Custom Agent AGY!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what feature or enhancement you want added.
    validations:
      required: true
  - type: textarea
    id: target-agent
    attributes:
      label: Affected Component / Agent
      description: Which agent or script does this apply to?
