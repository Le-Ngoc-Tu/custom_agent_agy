name: Bug report
description: Create a report to help us fix bugs or unexpected agent behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: agent-name
    attributes:
      label: Target Agent
      description: Which agent prompt caused the issue? (e.g., ba-requirements-specialist)
      placeholder: e.g., dev-security-implementer
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Issue
      description: Provide a clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: input-prompt
    attributes:
      label: User Input Prompt
      description: What prompt was passed to the agent?
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
